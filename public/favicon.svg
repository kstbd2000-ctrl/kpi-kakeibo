<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bodyGrad" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#f5d060"/>
      <stop offset="45%" stop-color="#d4a028"/>
      <stop offset="100%" stop-color="#b07a10"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae080"/>
      <stop offset="100%" stop-color="#e0b030"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe88a"/>
      <stop offset="100%" stop-color="#c9a028"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="rgba(80,40,0,0.4)"/>
    </filter>
  </defs>

  <!-- Body -->
  <ellipse cx="30" cy="38" rx="20" ry="16" fill="url(#bodyGrad)" filter="url(#sh)"/>

  <!-- Belly -->
  <ellipse cx="29" cy="40" rx="11" ry="8.5" fill="url(#bellyGrad)" opacity="0.55"/>

  <!-- Head -->
  <circle cx="48" cy="30" r="11" fill="url(#bodyGrad)" filter="url(#sh)"/>

  <!-- Ear -->
  <ellipse cx="43.5" cy="19.5" rx="3.8" ry="5.2" fill="#c08010" transform="rotate(-18 43.5 19.5)"/>
  <ellipse cx="43.5" cy="19.8" rx="2" ry="3" fill="#e8a828" transform="rotate(-18 43.5 19.8)"/>

  <!-- Snout -->
  <ellipse cx="56" cy="33" rx="6" ry="5" fill="#c98818"/>
  <circle cx="54.4" cy="33" r="1.4" fill="#8a5808"/>
  <circle cx="57.6" cy="33" r="1.4" fill="#8a5808"/>

  <!-- Eye -->
  <circle cx="50.5" cy="26" r="2.4" fill="#fff"/>
  <circle cx="51" cy="26" r="1.3" fill="#2a1400"/>
  <circle cx="51.6" cy="25.2" r="0.55" fill="white"/>

  <!-- Coin slot -->
  <rect x="26" y="22" width="10" height="2.8" rx="1.4" fill="#7a4c06" opacity="0.75"/>

  <!-- Coin -->
  <ellipse cx="31" cy="21.5" rx="4.5" ry="2" fill="url(#coinGrad)" stroke="#c9a028" stroke-width="0.6"/>
  <text x="31" y="22.8" font-size="3.8" text-anchor="middle" fill="#7a4c06" font-weight="bold" font-family="serif">&#165;</text>

  <!-- Legs -->
  <rect x="15" y="51" width="6.5" height="8" rx="3.2" fill="#c08010"/>
  <rect x="24" y="52" width="6.5" height="7" rx="3.2" fill="#c08010"/>
  <rect x="33" y="52" width="6.5" height="7" rx="3.2" fill="#c08010"/>
  <rect x="42" y="51" width="6.5" height="8" rx="3.2" fill="#c08010"/>

  <!-- Tail -->
  <path d="M11 36 Q5 34 7 28 Q9 23 13.5 26 Q16 28.5 13 30.5" fill="none" stroke="#c08010" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Shine -->
  <ellipse cx="21" cy="30" rx="5" ry="2.8" fill="white" opacity="0.2" transform="rotate(-30 21 30)"/>
  <ellipse cx="43" cy="24" rx="3" ry="1.8" fill="white" opacity="0.2" transform="rotate(-30 43 24)"/>
</svg>
